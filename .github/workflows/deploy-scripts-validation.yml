name: Deploy Scripts Validation

on:
  push:
    branches:
      - main
    paths:
      - scripts/00-cleanup.sh
      - scripts/01-create.sh
      - scripts/02-deploy.sh
      - scripts/03-startup.sh
      - scripts/lib.sh
      - template/**
      - .env.sample
      - config/**
      - .github/workflows/deploy-scripts-validation.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/00-cleanup.sh
      - scripts/01-create.sh
      - scripts/02-deploy.sh
      - scripts/03-startup.sh
      - scripts/lib.sh
      - template/**
      - .env.sample
      - config/**
      - .github/workflows/deploy-scripts-validation.yml

jobs:
  shellcheck:
    name: Shellcheck and Bash Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: |
          bash -n scripts/00-cleanup.sh
          bash -n scripts/01-create.sh
          bash -n scripts/02-deploy.sh
          bash -n scripts/03-startup.sh
          bash -n scripts/lib.sh

      - name: Shellcheck validation
        run: |
          shellcheck -S warning scripts/00-cleanup.sh
          shellcheck -S warning scripts/01-create.sh
          shellcheck -S warning scripts/02-deploy.sh
          shellcheck -S warning scripts/03-startup.sh
          shellcheck -S warning scripts/lib.sh

  template-generation:
    name: Template Generation and Variable Substitution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run 01-create.sh with default prefix
        run: |
          cp .env.sample .env
          bash scripts/01-create.sh

      - name: Verify generated files exist
        run: |
          test -f config/runtime.env
          test -f config/quadlet/pdnsstack-net.network
          test -f config/quadlet/pdnsstack-auth.container
          test -f config/quadlet/pdnsstack-dnsdist.container
          test -f config/quadlet/pdnsstack-cache-int.container
          test -f config/quadlet/pdnsstack-db.container
          test -f config/quadlet/pdnsstack-poweradmin.container
          test -f config/systemd/pdnsstack-backup.service
          test -f config/systemd/pdnsstack-backup.timer
          test -f config/db/init.sql
          test -f config/poweradmin/config.inc.php
          test -f config/cache-int/recursor.yml
          echo "All expected config files generated."

      - name: Verify no unexpanded placeholders remain
        run: |
          if grep -rEq '{{[[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*}}' config/quadlet/ config/db/ config/poweradmin/ config/cache-int/; then
            echo "ERROR: Found unexpanded Jinja placeholders in generated files"
            grep -rEl '{{[[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*}}' config/quadlet/ config/db/ config/poweradmin/ config/cache-int/
            exit 1
          fi
          echo "No unexpanded placeholders found."

      - name: Verify runtime.env required variables
        run: |
          required_vars=(
            ENABLE_CACHE_NGN
            PDNSSTACK_NETWORK_SERVICE
            PDNSSTACK_DB_SERVICE
            PDNSSTACK_AUTH_SERVICE
            PDNSSTACK_CACHE_INT_SERVICE
            PDNSSTACK_CACHE_NGN_SERVICE
            PDNSSTACK_DNSDIST_SERVICE
            PDNSSTACK_BACKUP_SERVICE
            PDNSSTACK_BACKUP_TIMER
          )
          for var in "${required_vars[@]}"; do
            if ! grep -q "^${var}=" config/runtime.env; then
              echo "ERROR: Missing variable in runtime.env: ${var}"
              exit 1
            fi
          done
          echo "runtime.env contains all required variables."

  custom-prefix:
    name: Custom PDNSSTACK_MODULE_PREFIX Support (Issue #25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run 01-create.sh with custom prefix
        run: |
          cp .env.sample .env
          sed -i 's/^PDNSSTACK_MODULE_PREFIX=.*/PDNSSTACK_MODULE_PREFIX=myrc1/' .env
          sed -i 's/^PDNSSTACK_HOST_IPV4=.*/PDNSSTACK_HOST_IPV4=192.168.0.2/' .env
          sed -i 's/^PDNSSTACK_INITIAL_DOMAIN=.*/PDNSSTACK_INITIAL_DOMAIN=example.com/' .env
          sed -i 's/^PDNSSTACK_DB_ROOT_PASSWORD=.*/PDNSSTACK_DB_ROOT_PASSWORD=root-pw-test/' .env
          sed -i 's/^PDNSSTACK_AUTH_DB_NAME=.*/PDNSSTACK_AUTH_DB_NAME=powerdns/' .env
          sed -i 's/^PDNSSTACK_AUTH_DB_USER=.*/PDNSSTACK_AUTH_DB_USER=pdnsuser/' .env
          sed -i 's/^PDNSSTACK_AUTH_DB_PASSWORD=.*/PDNSSTACK_AUTH_DB_PASSWORD=pdns-pw-test/' .env
          sed -i 's/^PDNSSTACK_POWERADMIN_DB_NAME=.*/PDNSSTACK_POWERADMIN_DB_NAME=poweradmin/' .env
          sed -i 's/^PDNSSTACK_POWERADMIN_DB_USER=.*/PDNSSTACK_POWERADMIN_DB_USER=pauser/' .env
          sed -i 's/^PDNSSTACK_POWERADMIN_DB_PASSWORD=.*/PDNSSTACK_POWERADMIN_DB_PASSWORD=pa-pw-test/' .env
          bash scripts/01-create.sh

      - name: Verify custom prefix applied to generated files
        run: |
          test -f config/quadlet/myrc1-net.network
          test -f config/quadlet/myrc1-auth.container
          test -f config/quadlet/myrc1-dnsdist.container
          test -f config/quadlet/myrc1-cache-int.container
          test -f config/quadlet/myrc1-db.container
          test -f config/quadlet/myrc1-poweradmin.container
          test -f config/systemd/myrc1-backup.service
          echo "Custom prefix files verified."

      - name: Verify runtime.env uses custom prefix
        run: |
          grep -q "PDNSSTACK_NETWORK_SERVICE=myrc1-net-network.service" config/runtime.env
          grep -q "PDNSSTACK_DB_SERVICE=myrc1-db.service" config/runtime.env
          grep -q "PDNSSTACK_AUTH_SERVICE=myrc1-auth.service" config/runtime.env
          grep -q "PDNSSTACK_DNSDIST_SERVICE=myrc1-dnsdist.service" config/runtime.env
          echo "Custom prefix correctly reflected in runtime.env."

      - name: Verify no leftover default prefix in critical configs
        run: |
          for f in config/quadlet/myrc1-*.container config/quadlet/myrc1-*.network; do
            if grep -q 'pdnsstack-' "${f}"; then
              echo "ERROR: Found leftover 'pdnsstack-' prefix in ${f}"
              grep 'pdnsstack-' "${f}"
              exit 1
            fi
          done
          echo "No leftover default prefix found."

  ngn-forwarder:
    name: NGN Forwarder Injection Verification (Issue #15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run 01-create.sh with NGN forwarders enabled
        run: |
          cp .env.sample .env
          sed -i 's/^PDNSSTACK_HOST_IPV4=.*/PDNSSTACK_HOST_IPV4=192.168.0.2/' .env
          sed -i 's/^PDNSSTACK_INITIAL_DOMAIN=.*/PDNSSTACK_INITIAL_DOMAIN=example.com/' .env
          sed -i 's/^PDNSSTACK_DB_ROOT_PASSWORD=.*/PDNSSTACK_DB_ROOT_PASSWORD=root-pw-test/' .env
          sed -i 's/^PDNSSTACK_AUTH_DB_NAME=.*/PDNSSTACK_AUTH_DB_NAME=powerdns/' .env
          sed -i 's/^PDNSSTACK_AUTH_DB_USER=.*/PDNSSTACK_AUTH_DB_USER=pdnsuser/' .env
          sed -i 's/^PDNSSTACK_AUTH_DB_PASSWORD=.*/PDNSSTACK_AUTH_DB_PASSWORD=pdns-pw-test/' .env
          sed -i 's/^PDNSSTACK_POWERADMIN_DB_NAME=.*/PDNSSTACK_POWERADMIN_DB_NAME=poweradmin/' .env
          sed -i 's/^PDNSSTACK_POWERADMIN_DB_USER=.*/PDNSSTACK_POWERADMIN_DB_USER=pauser/' .env
          sed -i 's/^PDNSSTACK_POWERADMIN_DB_PASSWORD=.*/PDNSSTACK_POWERADMIN_DB_PASSWORD=pa-pw-test/' .env
          sed -i 's/^PDNSSTACK_NGN_DNS_IPV6_1=.*/PDNSSTACK_NGN_DNS_IPV6_1=2001:db8::53/' .env
          sed -i 's/^PDNSSTACK_NGN_DNS_IPV6_2=.*/PDNSSTACK_NGN_DNS_IPV6_2=2001:db8::54/' .env
          bash scripts/01-create.sh

      - name: Verify cache-ngn Quadlet file generated
        run: |
          test -f config/quadlet/pdnsstack-cache-ngn.container
          echo "cache-ngn Quadlet file present."

      - name: Verify NGN recursor config has forwarders injected
        run: |
          test -f config/cache-ngn/recursor.yml
          grep -q 'zone: "\."' config/cache-ngn/recursor.yml
          grep -q '2001:db8::53' config/cache-ngn/recursor.yml
          grep -q '2001:db8::54' config/cache-ngn/recursor.yml
          echo "NGN forwarders correctly injected."

      - name: Verify ENABLE_CACHE_NGN is true in runtime.env
        run: |
          grep -q "ENABLE_CACHE_NGN=true" config/runtime.env
          echo "ENABLE_CACHE_NGN=true confirmed."

  schema-download:
    name: Version-linked Schema Download Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
 
      - name: Validate version helper functions
        run: |
          source scripts/lib.sh
          validate_version_format "PDNSSTACK_AUTH_VERSION" "5.2" major_minor
          validate_version_format "PDNSSTACK_POWERADMIN_VERSION" "4.4.0" semver
          test "$(derive_auth_image_from_version 5.2)" = "powerdns/pdns-auth-52"
          test "$(derive_auth_schema_ref 5.2)" = "rel-auth-5.2.x"
          test "$(derive_poweradmin_schema_ref 4.4.0)" = "v4.4.0"

      - name: Reject invalid version formats
        run: |
          cp .env.sample .env
          sed -i 's/^PDNSSTACK_AUTH_VERSION=.*/PDNSSTACK_AUTH_VERSION=invalid/' .env
          if bash scripts/01-create.sh >invalid.log 2>&1; then
            echo "ERROR: invalid auth version unexpectedly passed"
            exit 1
          fi
          grep -q "Invalid version format" invalid.log

          cp .env.sample .env
          sed -i 's/^PDNSSTACK_POWERADMIN_VERSION=.*/PDNSSTACK_POWERADMIN_VERSION=4.4/' .env
          if bash scripts/01-create.sh >invalid.log 2>&1; then
            echo "ERROR: invalid poweradmin version unexpectedly passed"
            exit 1
          fi
          grep -q "Invalid version format" invalid.log

      - name: Run 02-deploy.sh with mocked schema downloads
        run: |
          TEST_ROOT=$(mktemp -d)
          trap 'sudo rm -rf "${TEST_ROOT}" .env invalid.log' EXIT
          BASE_DIR="${TEST_ROOT}/base"
          QUADLET_DIR="${TEST_ROOT}/quadlet"
          SYSTEMD_DIR="${TEST_ROOT}/systemd"
          MOCK_BIN="${TEST_ROOT}/mock-bin"
          mkdir -p "${MOCK_BIN}" "${QUADLET_DIR}" "${SYSTEMD_DIR}"

          cp .env.sample .env
          sed -i "s|^PDNSSTACK_BASE_DIR=.*|PDNSSTACK_BASE_DIR=${BASE_DIR}|" .env
          sed -i "s|^PDNSSTACK_QUADLET_DIR=.*|PDNSSTACK_QUADLET_DIR=${QUADLET_DIR}|" .env
          sed -i "s|^PDNSSTACK_SYSTEMD_DIR=.*|PDNSSTACK_SYSTEMD_DIR=${SYSTEMD_DIR}|" .env
          sed -i 's/^PDNSSTACK_AUTH_VERSION=.*/PDNSSTACK_AUTH_VERSION=5.1/' .env
          sed -i 's/^PDNSSTACK_POWERADMIN_VERSION=.*/PDNSSTACK_POWERADMIN_VERSION=4.3.4/' .env
          bash scripts/01-create.sh

          cat > "${MOCK_BIN}/curl" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          output=""
          while [[ "$#" -gt 0 ]]; do
            case "$1" in
              -o)
                output="$2"
                shift 2
                ;;
              *)
                url="$1"
                shift
                ;;
            esac
          done
          case "${url}" in
            *modules/gmysqlbackend/schema.mysql.sql)
              printf 'CREATE TABLE domains (id INT);\n' > "${output}"
              ;;
            *sql/poweradmin-mysql-db-structure.sql)
              printf 'CREATE TABLE users (id INT);\n' > "${output}"
              ;;
            *)
              exit 1
              ;;
          esac
          EOF
          chmod +x "${MOCK_BIN}/curl"

          cat > "${MOCK_BIN}/systemctl" <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
          chmod +x "${MOCK_BIN}/systemctl"

          sudo env PATH="${MOCK_BIN}:$PATH" bash scripts/02-deploy.sh | tee deploy.log

          test -f "${BASE_DIR}/config/schema/pdns-auth-gmysql-schema.mysql.sql"
          test -f "${BASE_DIR}/config/schema/poweradmin-mysql-db-structure.sql"
          grep -q "PowerDNS Authoritative schema ref: rel-auth-5.1.x" deploy.log
          grep -q "PowerAdmin schema ref: v4.3.4" deploy.log

      - name: Fail 02-deploy.sh when schema download fails
        run: |
          TEST_ROOT=$(mktemp -d)
          trap 'sudo rm -rf "${TEST_ROOT}" .env deploy-fail.log' EXIT
          BASE_DIR="${TEST_ROOT}/base"
          QUADLET_DIR="${TEST_ROOT}/quadlet"
          SYSTEMD_DIR="${TEST_ROOT}/systemd"
          MOCK_BIN="${TEST_ROOT}/mock-bin"
          mkdir -p "${MOCK_BIN}" "${QUADLET_DIR}" "${SYSTEMD_DIR}"

          cp .env.sample .env
          sed -i "s|^PDNSSTACK_BASE_DIR=.*|PDNSSTACK_BASE_DIR=${BASE_DIR}|" .env
          sed -i "s|^PDNSSTACK_QUADLET_DIR=.*|PDNSSTACK_QUADLET_DIR=${QUADLET_DIR}|" .env
          sed -i "s|^PDNSSTACK_SYSTEMD_DIR=.*|PDNSSTACK_SYSTEMD_DIR=${SYSTEMD_DIR}|" .env
          bash scripts/01-create.sh

          cat > "${MOCK_BIN}/curl" <<'EOF'
          #!/usr/bin/env bash
          exit 1
          EOF
          chmod +x "${MOCK_BIN}/curl"

          cat > "${MOCK_BIN}/systemctl" <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
          chmod +x "${MOCK_BIN}/systemctl"

          if sudo env PATH="${MOCK_BIN}:$PATH" bash scripts/02-deploy.sh >deploy-fail.log 2>&1; then
            echo "ERROR: deploy unexpectedly succeeded"
            exit 1
          fi
          grep -q "Failed to download" deploy-fail.log

  deploy-structure:
    name: Deployment Directory Structure Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate config files
        run: |
          cp .env.sample .env
          bash scripts/01-create.sh

      - name: Verify all required config source directories exist for 02-deploy.sh
        run: |
          required_dirs=(dnsdist cache-int auth db poweradmin)
          for d in "${required_dirs[@]}"; do
            if [[ ! -d "config/${d}" ]]; then
              echo "ERROR: Required config source directory not found: config/${d}"
              exit 1
            fi
          done
          echo "All required config source directories present."

      - name: Simulate 02-deploy.sh directory creation
        run: |
          BASE_DIR=$(mktemp -d)
          trap 'rm -rf "${BASE_DIR}"' EXIT

          mkdir -p "${BASE_DIR}"/{config,data,backup}

          for d in dnsdist cache-int cache-ngn auth db poweradmin; do
            mkdir -p "${BASE_DIR}/config/${d}"
            mkdir -p "${BASE_DIR}/data/${d}"
          done

          mkdir -p "${BASE_DIR}/backup/db"

          # Verify required structure
          for sub in config data backup; do
            test -d "${BASE_DIR}/${sub}"
          done

          for d in dnsdist cache-int cache-ngn auth db poweradmin; do
            test -d "${BASE_DIR}/config/${d}"
            test -d "${BASE_DIR}/data/${d}"
          done

          test -d "${BASE_DIR}/backup/db"
          echo "Deployment directory structure validated."

  image-version-substitution:
    name: Version-linked Image Substitution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
 
      - name: Test default version-linked images from .env.sample
        run: |
          cp .env.sample .env
          bash scripts/01-create.sh
          grep -q "Image=docker.io/library/mariadb:11" config/quadlet/pdnsstack-db.container
          grep -q "Image=powerdns/pdns-auth-52" config/quadlet/pdnsstack-auth.container
          grep -q "Image=docker.io/powerdns/pdns-recursor-55:latest" config/quadlet/pdnsstack-cache-int.container
          grep -q "Image=docker.io/powerdns/dnsdist-21:latest" config/quadlet/pdnsstack-dnsdist.container
          grep -q "Image=poweradmin/poweradmin:4.4.0" config/quadlet/pdnsstack-poweradmin.container
          echo "Default image versions verified."
 
      - name: Test custom version-derived images
        run: |
          cp .env.sample .env
          sed -i 's/^PDNSSTACK_AUTH_VERSION=.*/PDNSSTACK_AUTH_VERSION=5.1/' .env
          sed -i 's/^PDNSSTACK_POWERADMIN_VERSION=.*/PDNSSTACK_POWERADMIN_VERSION=4.3.4/' .env
          bash scripts/01-create.sh
          grep -q "Image=powerdns/pdns-auth-51" config/quadlet/pdnsstack-auth.container
          grep -q "Image=poweradmin/poweradmin:4.3.4" config/quadlet/pdnsstack-poweradmin.container
          echo "Custom version-derived images verified."
 
      - name: Test legacy image overrides remain supported
        run: |
          cp .env.sample .env
          echo 'PDNSSTACK_AUTH_IMAGE_FULL=registry.example.com/pdns-auth:test' >> .env
          echo 'PDNSSTACK_POWERADMIN_IMAGE_FULL=registry.example.com/poweradmin:test' >> .env
          bash scripts/01-create.sh
          grep -q "Image=registry.example.com/pdns-auth:test" config/quadlet/pdnsstack-auth.container
          grep -q "Image=registry.example.com/poweradmin:test" config/quadlet/pdnsstack-poweradmin.container
          echo "Legacy image overrides verified."

      - name: Verify no unexpanded image placeholders
        run: |
          cp .env.sample .env
          bash scripts/01-create.sh
          if grep -rEq '{{[[:space:]]*PDNSSTACK_[A-Z_]*FULL_IMAGE[[:space:]]*}}' config/quadlet/; then
            echo "ERROR: Found unexpanded image placeholders"
            grep -rEl '{{[[:space:]]*PDNSSTACK_[A-Z_]*FULL_IMAGE[[:space:]]*}}' config/quadlet/
            exit 1
          fi
          echo "No unexpanded image placeholders found."

  startup-schema-idempotency:
    name: Startup Schema Import Idempotency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run 03-startup.sh twice with shared DB mocks
        run: |
          TEST_ROOT=$(mktemp -d)
          trap 'rm -rf "${TEST_ROOT}" .env' EXIT
          BASE_DIR="${TEST_ROOT}/base"
          MOCK_BIN="${TEST_ROOT}/mock-bin"
          STATE_DIR="${TEST_ROOT}/state"
          mkdir -p "${BASE_DIR}/config/db" "${BASE_DIR}/config/schema" "${MOCK_BIN}" "${STATE_DIR}"

          cp .env.sample .env
          sed -i "s|^PDNSSTACK_BASE_DIR=.*|PDNSSTACK_BASE_DIR=${BASE_DIR}|" .env
          sed -i 's/^PDNSSTACK_POWERADMIN_DB_NAME=.*/PDNSSTACK_POWERADMIN_DB_NAME=powerdns/' .env
          bash scripts/01-create.sh

          cp config/runtime.env "${BASE_DIR}/config/runtime.env"
          cp config/db/init.sql "${BASE_DIR}/config/db/init.sql"
          printf 'CREATE TABLE domains (id INT);\n' > "${BASE_DIR}/config/schema/pdns-auth-gmysql-schema.mysql.sql"
          printf 'CREATE TABLE users (id INT);\n' > "${BASE_DIR}/config/schema/poweradmin-mysql-db-structure.sql"

          cat > "${MOCK_BIN}/systemctl" <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
          chmod +x "${MOCK_BIN}/systemctl"

          cat > "${MOCK_BIN}/podman" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          args=("$@")
          if [[ "${args[0]}" != "exec" ]]; then
            exit 1
          fi

          idx=1
          if [[ "${args[$idx]}" == "-i" ]]; then
            idx=$((idx + 1))
          fi
          idx=$((idx + 1)) # container name
          command="${args[$idx]}"
          idx=$((idx + 1))

          case "${command}" in
            mariadb-admin)
              exit 0
              ;;
            mariadb)
              if [[ " ${args[*]} " == *" table_name='domains' "* ]]; then
                [[ -f "${STATE_DIR}/domains" ]] && printf '1\n'
                exit 0
              fi
              if [[ " ${args[*]} " == *" table_name='users' "* ]]; then
                [[ -f "${STATE_DIR}/users" ]] && printf '1\n'
                exit 0
              fi

              if [[ -t 0 ]]; then
                exit 0
              fi

              sql="$(cat)"
              if [[ "${sql}" == *"CREATE TABLE domains"* ]]; then
                touch "${STATE_DIR}/domains"
                count=$(cat "${STATE_DIR}/auth_count" 2>/dev/null || echo 0)
                printf '%s\n' $((count + 1)) > "${STATE_DIR}/auth_count"
              fi
              if [[ "${sql}" == *"CREATE TABLE users"* ]]; then
                touch "${STATE_DIR}/users"
                count=$(cat "${STATE_DIR}/poweradmin_count" 2>/dev/null || echo 0)
                printf '%s\n' $((count + 1)) > "${STATE_DIR}/poweradmin_count"
              fi
              ;;
            *)
              exit 1
              ;;
          esac
          EOF
          chmod +x "${MOCK_BIN}/podman"

          PATH="${MOCK_BIN}:$PATH" STATE_DIR="${STATE_DIR}" bash scripts/03-startup.sh
          PATH="${MOCK_BIN}:$PATH" STATE_DIR="${STATE_DIR}" bash scripts/03-startup.sh

          test "$(cat "${STATE_DIR}/auth_count")" = "1"
          test "$(cat "${STATE_DIR}/poweradmin_count")" = "1"
          test -f "${STATE_DIR}/domains"
          test -f "${STATE_DIR}/users"

  cleanup-script:
    name: Cleanup Script Logic Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify systemctl disable pattern exists
        run: |
          grep -q "systemctl disable --now" scripts/00-cleanup.sh
          echo "systemctl disable --now pattern present."

      - name: Verify file removal logic exists
        run: |
          grep -q "rm -f" scripts/00-cleanup.sh
          echo "File removal logic present."

      - name: Verify daemon-reload is called
        run: |
          grep -q "systemctl daemon-reload" scripts/00-cleanup.sh
          echo "systemctl daemon-reload present."

      - name: Verify QUADLET_SUFFIXES covers expected types
        run: |
          grep -q "container" scripts/00-cleanup.sh
          grep -q "network" scripts/00-cleanup.sh
          echo "Quadlet suffix types verified."
